name: Engineering foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  javascript:
    name: JavaScript quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit high-severity dependency vulnerabilities
        run: pnpm run audit:dependencies

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint workspace
        run: pnpm run lint

      - name: Type-check workspace
        run: pnpm run typecheck

      - name: Test workspace with coverage
        run: pnpm run test

      - name: Build workspace
        run: pnpm run build

  api:
    name: API quality, tests, and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Poetry
        run: python -m pip install poetry==2.1.3

      - name: Install API dependencies
        run: poetry --directory apps/api install --with dev --no-interaction --no-ansi

      - name: Check API formatting and lint
        run: pnpm --version >/dev/null 2>&1 || true; poetry --directory apps/api run black --check . && poetry --directory apps/api run ruff check .

      - name: Type-check API
        run: poetry --directory apps/api run mypy app main.py

      - name: Test API with coverage
        run: poetry --directory apps/api run pytest

      - name: Smoke-test API import and routes
        run: poetry --directory apps/api run python scripts/smoke_app.py

      - name: Validate reversible migrations
        run: poetry --directory apps/api run python scripts/validate_migrations.py

  containers:
    name: Compose and production images
    needs: [javascript, api]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose profiles
        run: |
          for profile in core automation ai monitoring full; do
            docker compose --env-file .env.example --profile "$profile" config --quiet
          done

      - name: Build API image
        run: docker build --pull=false -t nexora-api:${{ github.sha }} apps/api

      - name: Build web image
        run: docker build --pull=false -f apps/web/Dockerfile -t nexora-web:${{ github.sha }} .

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
