services:
  api:
    environment:
      ENVIRONMENT: production
      DEBUG: 'false'
      LOG_LEVEL: INFO
      CORS_ORIGINS: https://${NEXORA_HOST:?Set NEXORA_HOST in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}

  web:
    build:
      args:
        NEXT_PUBLIC_API_URL: https://${NEXORA_HOST:?Set NEXORA_HOST in .env}/api/v1
    environment:
      INTERNAL_API_URL: http://api:8000/api/v1
      NEXT_PUBLIC_API_URL: https://${NEXORA_HOST:?Set NEXORA_HOST in .env}/api/v1

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      NEXORA_HOST: ${NEXORA_HOST:?Set NEXORA_HOST in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-T',
          '5',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:2019/config/',
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    volumes:
      - ./deploy/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [nexora]

volumes:
  caddy_data:
  caddy_config:
